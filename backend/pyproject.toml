[project]
name = "credible-backend"
version = "0.1.0"
description = "CredAble supplemental assessment and loan comparison backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "python-multipart>=0.0.22,<1.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
